[package]
name = 'azidentity'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.88'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'azidentity'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
async-trait = '0.1'
azure_core = '=1.0.0'
azure_identity = { version = '=1.0.0', features = [ 'tokio' ] }
extendr-api = '=0.9.0'
tokio = { version = '1.49', features = [ 'macros', 'rt-multi-thread' ] }

[profile.release]
lto = true
codegen-units = 1
